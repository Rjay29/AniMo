<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | AniMo</title>
    <!-- Stylesheet Reference -->
    <link rel="stylesheet" href="../../shared/css/global.css" />
    <!-- Stylesheet Reference -->
    <link rel="stylesheet" href="../../shared/css/components.css" />
    <!-- Stylesheet Reference -->
    <link rel="stylesheet" href="./register.css" />
    <!-- Page Script -->
    <script src="../../shared/js/api.js" defer></script>
  </head>
  <body class="site-shell">
    <!-- Main Content -->
    <main>
      <!-- Account Registration -->
      <section class="section"><div class="container auth-shell">
      <!-- Registration Form -->
        <form class="auth-card card" id="registerForm"><span class="eyebrow">Join the local market</span><h1>Create your account</h1><label>Username<input class="input" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._\-]{3,32}" required /></label><small>Use 3–32 letters, numbers, dots, dashes, or underscores.</small><label>Password<input class="input" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required /></label><small>Use at least 8 characters. Passwords are securely hashed on the server.</small><p class="auth-status" id="authStatus" role="status" aria-live="polite"></p><button class="btn btn-primary" type="submit">Create account</button><p>Already have an account? <a href="../login/login.html">Log in</a></p></form></div></section>
    </main>
    <!-- Page Script -->
    <script src="./register.js"></script>
  </body>
</html>
